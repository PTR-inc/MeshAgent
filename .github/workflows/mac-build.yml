name: macOS Build
run-name: Build MacOS versions of MeshAgent
# A build workflow only runs when something it builds from changed, so a documentation or
# workflow-only push does not rebuild every platform. Its own file counts, the other workflows do not.
on:
  push:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/mac-build.yml'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/mac-build.yml'
  workflow_dispatch:

# Deliberately native on macOS runners, because osxcross needs an Apple-licensed
# SDK that public CI cannot provision. The two ARCHIDs need different runners, so
# the pairing is curated and `guard` checks it still matches CLASS=macos.
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - name: The jobs below must cover every CLASS=macos ARCHID
        run: |
          want=$(make -s print-archids CLASS=macos | tr -s ' ' '\n' | sort -n | tr -d '\n')
          have=$(printf '16\n29\n' | sort -n | tr -d '\n')
          [ "$want" = "$have" ] || { echo "::error::CLASS=macos is now '$want' but mac-build.yml builds '$have'"; exit 1; }

  macos-build-arm64:
    name: macOS arm64 (ARCHID=29)
    runs-on: macos-15
    # rcodesign is fetched into $BUILDROOT for the re-signing step, and the default /opt/buildroot
    # is not writable on a hosted runner.
    env:
      BUILDROOT: ${{ github.workspace }}/br
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Build meshagent (arm64, KVM enabled)
        run: make -j4 macos ARCHID=29
      # The same driver as on Linux, phases 1 to 4: the -info banner (whose OpenSSL line must match
      # openssl/VERSION), the core stress run, the known 06-* crashes and the -b64exec delivery
      # path. No connection phase, since there is no MeshCentral to reach from a hosted runner.
      - name: Test meshagent (test/test-agent.sh, phases 1-4)
        run: test/test-agent.sh -q --no-connect -y -b build/osx-arm-64/meshagent_osx-arm-64 -l build/test-agent-macos-arm64.log
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-macos-arm64
          path: |
            ${{ github.workspace }}/build/*/meshagent_*
            ${{ github.workspace }}/build/test-agent-macos-arm64.log

  macos-build-x86_64:
    name: macOS x86_64 (ARCHID=16)
    runs-on: macos-15-intel
    # rcodesign is fetched into $BUILDROOT for the re-signing step, and the default /opt/buildroot
    # is not writable on a hosted runner.
    env:
      BUILDROOT: ${{ github.workspace }}/br
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.0
      - name: Build meshagent (x86_64, KVM enabled)
        run: make -j4 macos ARCHID=16
      # The same driver as on Linux, phases 1 to 4: the -info banner (whose OpenSSL line must match
      # openssl/VERSION), the core stress run, the known 06-* crashes and the -b64exec delivery
      # path. No connection phase, since there is no MeshCentral to reach from a hosted runner.
      - name: Test meshagent (test/test-agent.sh, phases 1-4)
        run: test/test-agent.sh -q --no-connect -y -b build/osx-x86-64/meshagent_osx-x86-64 -l build/test-agent-macos-x86_64.log
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-macos-x86_64
          path: |
            ${{ github.workspace }}/build/*/meshagent_*
            ${{ github.workspace }}/build/test-agent-macos-x86_64.log
