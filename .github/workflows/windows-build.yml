name: Windows Builder

run-name: Build Windows versions of MeshAgent (${{ inputs.configuration || 'Release' }})

# Called by build.yml (manual, one platform or all) or run alone from the Actions tab with
# workflow_dispatch. What this platform is built from is listed in .github/build-inputs.txt.
on:
  workflow_call:
    inputs:
      configuration:
        description: 'MSBuild configuration'
        type: string
        default: Release
  workflow_dispatch:
    inputs:
      configuration:
        description: 'MSBuild configuration'
        type: choice
        default: Release
        options: [Release, Debug]

env:
  # Pushes and pull requests always build Release, so only manual runs choose.
  CONFIGURATION: ${{ inputs.configuration || 'Release' }}

jobs:
  windows-build:
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.toolset == 'v145' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64,   toolset: v143, runner: windows-2022 }
          - { platform: x86,   toolset: v143, runner: windows-2022 }
          - { platform: ARM64, toolset: v143, runner: windows-11-arm }
          # - { platform: x64,   toolset: v145, runner: windows-2025-vs2026 }
          # - { platform: x86,   toolset: v145, runner: windows-2025-vs2026 }
          # - { platform: ARM64, toolset: v145, runner: windows-11-vs2026-arm }
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v3
    - name: Install the pinned MSVC toolset if this image lacks it
      # The pin lives in MeshAgent.Configuration.props. env.ps1 resolves the component id from the
      # installer catalog and runs the VS installer only when no matching toolset is present.
      if: matrix.toolset == 'v143'
      shell: pwsh
      env:
        BUILDROOT: ${{ github.workspace }}\br
      run: |
        . openssl/build/windows/env.ps1
        $arch = switch ('${{ matrix.platform }}') { 'x86' { 'x86' } 'x64' { 'x64' } 'ARM64' { 'x64_arm64' } }
        $have = Get-VcToolsetVersion -Arch $arch
        if ($have) { Write-Host "MSVC $have present for $arch" }
        else { Install-BuildRootWindows -BuildRoot $env:BUILDROOT -VsComponents -Force }
    - name: Check OpenSSL archives against the ${{ matrix.toolset }} toolset
      # Fails the build only for a wrong machine type, a wrong CRT or an LTCG mismatch.
      shell: pwsh
      run: openssl/build/windows/toolset-check.ps1 -Platform ${{ matrix.platform }} -Toolset ${{ matrix.toolset }}
    - name: Build ${{ matrix.platform }} ${{ env.CONFIGURATION }} (${{ matrix.toolset }})
      run: msbuild MeshAgent-2022.sln /nologo /v:q /clp:Summary /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ matrix.platform }} /p:MeshToolset=${{ matrix.toolset }}
    - name: Upload ${{ matrix.platform }} artifacts
      uses: actions/upload-artifact@v7
      with:
        name: meshagent-windows-${{ matrix.platform }}${{ env.CONFIGURATION != 'Release' && format('-{0}', env.CONFIGURATION) || '' }}${{ matrix.toolset != 'v143' && format('-{0}', matrix.toolset) || '' }}
        # Debug builds also upload the .pdb files so crashes can be symbolised.
        path: |
          build/win-*/*.exe
          ${{ startsWith(env.CONFIGURATION, 'Debug') && 'build/win-*/*.pdb' || '' }}
