name: Linux Build
run-name: Build Linux versions of MeshAgent
on:
  push:
  pull_request:

# The ARCHID list is not written here - it comes from `make print-archids`,
# so a new ARCH_ block in the makefile is picked up by CI automatically and an
# OBSOLETE one drops out. Toolchains come from each block's own FETCH/APTPKG
# fields via `make print-toolchain` and ./fetch-toolchains.sh. See BUILD.md.
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      archids: ${{ steps.r.outputs.archids }}
    steps:
      - uses: actions/checkout@v7.0.0
      - id: r
        run: |
          set -euo pipefail
          ids=$(make -s print-archids CLASS=generic; make -s print-archids CLASS=openwrt; make -s print-archids CLASS=vendor)
          json=$(printf '%s\n' $ids | awk 'NR>1{printf ","}{printf "\"%s\"", $0}')
          echo "archids=[$json]" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        archid: ${{ fromJSON(needs.resolve.outputs.archids) }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install host build prerequisites
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # KVM=1 targets need only the X11 headers (real calls are dlopen()'d);
          # the makefile's KVMINC adds them with -idirafter for every target.
          sudo apt-get install -y build-essential \
            libx11-dev libxtst-dev libxext-dev libxrandr-dev libjpeg62-dev \
            linux-libc-dev:i386 libc6-dev-i386 libjpeg62-dev:i386
      # YES=1 makes the makefile's ensure_toolchain provision the compiler
      # itself, from the block's own FETCH component or APTPKG - no toolchain
      # names live in this file.
      - name: Build ARCHID ${{ matrix.archid }}
        run: make -j4 linux ARCHID=${{ matrix.archid }} YES=1
      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-linux-${{ matrix.archid }}
          path: ${{ github.workspace }}/build/*/meshagent_*
      - name: Upload artifacts (act)
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: meshagent-linux-${{ matrix.archid }}
          path: ${{ github.workspace }}/build/*/meshagent_*
