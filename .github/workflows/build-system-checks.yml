name: Build system checks
run-name: Anti-drift gate + committed archive audit

# The anti-drift gate (openssl/build/consistency.sh) and the audit of every committed OpenSSL
# prefix (openssl/build/verify). Runs on any build-system file change pushed to a mainline branch. It is
# not a platform, so it stays outside build.yml's selection and lists its inputs here.
on:
  push:
    branches: [overmakefile, master]
    paths:
      - 'openssl/**'
      - 'build-env.sh'
      - 'fetch-toolchains.sh'
      - 'build-toolchain-archives.sh'
      - 'build-bsd-sysroot-archives.sh'
      - 'makefile'
      - 'BUILD.md'
      - '**/*.vcxproj'
      - '**/*.vcxproj.filters'
      - '**/*.props'
      - '*.sln'
      - 'check-vsprojects.sh'
      - '.github/**'
  pull_request:
    branches: [overmakefile, master]
    paths:
      - 'openssl/**'
      - 'build-env.sh'
      - 'fetch-toolchains.sh'
      - 'build-toolchain-archives.sh'
      - 'build-bsd-sysroot-archives.sh'
      - 'makefile'
      - 'BUILD.md'
      - '**/*.vcxproj'
      - '**/*.vcxproj.filters'
      - '**/*.props'
      - '*.sln'
      - 'check-vsprojects.sh'
      - '.github/**'
  workflow_dispatch:

jobs:
  consistency:
    name: Sources of truth still agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - run: openssl/build/consistency.sh

  vsprojects:
    name: Visual Studio projects and filters agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - run: ./check-vsprojects.sh

  verify-archives:
    name: Audit every committed OpenSSL prefix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - run: openssl/build/verify

  shellcheck:
    name: Build scripts parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - name: bash -n every build script
        run: |
          rc=0
          for f in build-env.sh fetch-toolchains.sh build-toolchain-archives.sh \
                   build-bsd-sysroot-archives.sh check-vsprojects.sh \
                   openssl/build/verify openssl/build/*.sh .github/scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done
          exit $rc
