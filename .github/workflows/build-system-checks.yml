name: Build system checks
run-name: Anti-drift gate + committed archive audit

# Runs on any build-system file change. The OpenSSL prefixes under openssl/<version>/
# are audited by openssl/build/verify, the drift gate is openssl/build/consistency.sh.
on:
  push:
    paths:
      - 'openssl/**'
      - 'build-env.sh'
      - 'fetch-toolchains.sh'
      - 'build-toolchain-archives.sh'
      - 'build-bsd-sysroot-archives.sh'
      - 'makefile'
      - 'BUILD.md'
      - '**/*.vcxproj'
      - '**/*.vcxproj.filters'
      - '**/*.props'
      - '*.sln'
      - 'check-vsprojects.sh'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'openssl/**'
      - 'build-env.sh'
      - 'fetch-toolchains.sh'
      - 'build-toolchain-archives.sh'
      - 'build-bsd-sysroot-archives.sh'
      - 'makefile'
      - 'BUILD.md'
      - '**/*.vcxproj'
      - '**/*.vcxproj.filters'
      - '**/*.props'
      - '*.sln'
      - 'check-vsprojects.sh'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

jobs:
  consistency:
    name: Sources of truth still agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: openssl/build/consistency.sh

  vsprojects:
    name: Visual Studio projects and filters agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./check-vsprojects.sh

  verify-archives:
    name: Audit every committed OpenSSL prefix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: openssl/build/verify

  shellcheck:
    name: Build scripts parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every build script
        run: |
          rc=0
          for f in build-env.sh fetch-toolchains.sh build-toolchain-archives.sh \
                   build-bsd-sysroot-archives.sh check-vsprojects.sh \
                   openssl/build/verify openssl/build/*.sh; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done
          exit $rc
