name: Build OpenSSL static libs
run-name: Build ${{ inputs.jobname }}${{ inputs.force == true && ' (force)' || '' }}${{ inputs.version_suffix == true && format(' [suffix -{0}]', inputs.version) || '' }}

# Every per-target decision (Configure target, compiler, asm, extra flags, libc
# family, toolchain provisioning, object count) comes from
# openssl/libstatic/build/targets.sh - and on Windows, from windows/build.ps1's
# own $Targets. This file only decides WHICH targets to dispatch and on what
# runner (T_CI: linux -> ubuntu, macos -> a macOS runner with Xcode's clang, the
# same host detection `make macos` does); it restates no recipe, no version, no
# URL and no checksum. The eight
# per-family openssl-*.yml workflows this replaced each carried their own copy
# and drifted from targets.sh repeatedly - see BUILD.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenSSL release version (default: the pin in build-env.sh)"
        required: false
        default: ""
      jobname:
        description: "Target to build: 'all', a family, or a single targets.sh target name"
        required: true
        default: "all"
      force:
        description: "Rebuild and overwrite even if the committed archive already matches this version"
        required: true
        default: false
        type: boolean
      # Suffixed archives are inert: the makefile and the .vcxproj files link the
      # unsuffixed names, so this stages a copy without changing any build.
      version_suffix:
        description: "Name the outputs libcrypto-<version>.a / libcrypto64MT-<version>.lib instead of overwriting the standard names"
        required: true
        default: false
        type: boolean
      create_pr:
        description: "Open a pull request with the rebuilt archives"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.r.outputs.version }}
      matrix: ${{ steps.r.outputs.matrix }}
      windows: ${{ steps.r.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        name: Resolve version and matrices from targets.sh / build.ps1
        run: |
          set -euo pipefail
          . ./build-env.sh >/dev/null
          v="${{ inputs.version }}"; [ -n "$v" ] || v="$OPENSSL_VERSION"
          openssl_sha256_lookup "$v" >/dev/null \
            || { echo "::error::'$v' does not resolve to a published OpenSSL release"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # One row per unix target: "<name> <runner>", runner chosen by T_CI.
          rows=$(for t in $(openssl/libstatic/build/targets.sh --names); do
                   case "$(openssl/libstatic/build/targets.sh --field "$t" CI)" in
                     macos) echo "$t macos-latest" ;;
                     *)     echo "$t ubuntu-24.04" ;;
                   esac
                 done)
          # Windows names come from build.ps1's own $Targets - grepped, not run,
          # so this job needs no pwsh (act's image has none). consistency.sh
          # check 5 asserts this parse agrees with `build.ps1 --names-json`.
          win=$(grep -oE "Name *= *'[^']+'" openssl/libstatic/build/windows/build.ps1 | sed "s/.*'\(.*\)'/\1/")

          sel="${{ inputs.jobname }}"
          case "$sel" in
            all)     ;;
            linux)   rows=$(echo "$rows" | awk '$2=="ubuntu-24.04"'); win="" ;;
            macos)   rows=$(echo "$rows" | awk '$2=="macos-latest"'); win="" ;;
            windows) rows="" ;;
            *)       rows=$(echo "$rows" | awk -v s="$sel" '$1==s')
                     win=$(echo "$win" | awk -v s="$sel" '$0==s')
                     [ -n "$rows$win" ] || { echo "::error::'$sel' is not a target of targets.sh or windows/build.ps1"; exit 1; } ;;
          esac

          m=$(echo "$rows" | awk 'NF{printf "%s{\"target\":\"%s\",\"os\":\"%s\"}", (n++?",":""), $1, $2}')
          w=$(echo "$win"  | awk 'NF{printf "%s\"%s\"", (n++?",":""), $0}')
          { echo "matrix=[$m]"; echo "windows=[$w]"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      BUILDROOT: ${{ github.workspace }}/br
      OPENSSL_VERSION: ${{ needs.resolve.outputs.version }}
      SFX: ${{ inputs.version_suffix && format('-{0}', needs.resolve.outputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      # On a macos runner targets.sh picks the native clang/ar/ranlib; on Linux
      # it cross-compiles - same composite action, same build.sh either way.
      - uses: ./.github/actions/openssl-build-target
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          force: ${{ inputs.force }}
          sfx: ${{ env.SFX }}
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ hashFiles('out/**') != '' && !env.ACT }}
        with: { name: "openssl-${{ matrix.target }}", path: out/ }
      - uses: actions/upload-artifact@v3
        if: ${{ hashFiles('out/**') != '' && env.ACT }}
        with: { name: "openssl-${{ matrix.target }}", path: out/ }

  windows:
    needs: resolve
    if: needs.resolve.outputs.windows != '[]'
    # arm64 is cross-built with the x64_arm64 MSVC toolset (build.ps1's VcVars),
    # so one x64 runner covers every Windows target.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.windows) }}
    env:
      BUILDROOT: ${{ github.workspace }}\br
      OPENSSL_VERSION: ${{ needs.resolve.outputs.version }}
      SFX: ${{ inputs.version_suffix && format('-{0}', needs.resolve.outputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - name: Install Strawberry Perl (Configure needs a real Windows perl)
        shell: pwsh
        run: choco install -y strawberryperl --no-progress
      - name: Fetch the OpenSSL source (URL and sha256 both from env.ps1)
        shell: pwsh
        run: |
          . openssl/libstatic/build/windows/env.ps1
          New-Item -ItemType Directory -Force -Path $env:BR_DOWNLOADS | Out-Null
          if (-not (Save-BrDownload -Url $script:OpenSslUrl -Path $script:OpenSslTarball -Sha256 (Get-OpenSslSha256))) {
            throw "could not fetch $($script:OpenSslUrl)"
          }
      # build.ps1 owns the recipe, the .lib naming and the version/object-count
      # gates - this step only invokes it. force is irrelevant here: build.ps1
      # always rebuilds, and the collect step below uploads only what changed.
      - name: Build ${{ matrix.target }}
        shell: pwsh
        run: |
          pwsh -File openssl/libstatic/build/windows/build.ps1 ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 ${{ matrix.target }} failed" }
      - name: Collect what the build actually changed
        shell: bash
        run: |
          mkdir -p out
          git status --porcelain -- openssl/libstatic | awk '{print $2}' | while read -r f; do
            d="out/$(dirname "$f")"; mkdir -p "$d"
            b=$(basename "$f"); ext="${b##*.}"; stem="${b%.*}"
            cp "$f" "$d/${stem}${SFX}.${ext}"
          done
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ hashFiles('out/**') != '' && !env.ACT }}
        with: { name: "openssl-windows-${{ matrix.target }}", path: out/ }
      - uses: actions/upload-artifact@v3
        if: ${{ hashFiles('out/**') != '' && env.ACT }}
        with: { name: "openssl-windows-${{ matrix.target }}", path: out/ }

  verify-summary:
    needs: [resolve, build, windows]
    if: always()
    runs-on: ubuntu-24.04
    env:
      SFX: ${{ inputs.version_suffix && format('-{0}', needs.resolve.outputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with: { path: artifacts }
      - name: Overlay this run's freshly built archives onto the checkout
        run: |
          # download-artifact nests under artifacts/<name>/ with multiple artifacts, flat with one - search instead of assuming depth.
          find artifacts -type d -path '*/openssl/libstatic' -print0 |
            while IFS= read -r -d '' d; do cp -rf "$d"/. openssl/libstatic/; done
      - name: Audit every archive - version, object count, libc symbol gates
        run: openssl/libstatic/verify
      - name: Fail if any dispatched target did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more dispatched targets failed or were cancelled - their archives were NOT" >&2
          echo "regenerated this run, and the overlay step left the old committed archive in place." >&2
          exit 1
      - name: Fail if a full ('all') rebuild left any archive stale
        if: inputs.jobname == 'all'
        run: |
          fail=0
          for f in $(find openssl/libstatic -name "libcrypto${SFX}.a"); do
            strings "$f" | grep -qF "OpenSSL ${{ needs.resolve.outputs.version }} " && continue
            v=$(strings "$f" | grep -oE 'OpenSSL [0-9]+\.[0-9]+\.[0-9]+[a-z]?' | sort -u | tr '\n' ' ')
            echo "STALE: $f -> ${v:-none} (expected OpenSSL ${{ needs.resolve.outputs.version }})" >&2
            fail=1
          done
          exit $fail
      - name: Open a pull request with the rebuilt archives
        if: inputs.create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: openssl/libstatic
          commit-message: "openssl: update static libs to ${{ needs.resolve.outputs.version }} (${{ inputs.jobname }})"
          title: "openssl: update static libs to ${{ needs.resolve.outputs.version }} (${{ inputs.jobname }})"
          body: |
            Automated rebuild via `${{ github.workflow }}` (jobname=${{ inputs.jobname }}, force=${{ inputs.force }}, version_suffix=${{ inputs.version_suffix }}).

            No pull request is opened if the rebuilt archives are byte-identical to what is already committed.
          branch: openssl-update-${{ needs.resolve.outputs.version }}-${{ inputs.jobname }}${{ inputs.version_suffix == true && '-suffixed' || '' }}
          base: ${{ github.ref_name }}
