name: Build OpenSSL static libs
run-name: Build OpenSSL for ${{ inputs.jobname }}${{ inputs.version != '' && format(' (OpenSSL {0})', inputs.version) || '' }}${{ inputs.force == true && ' (force)' || '' }}

# This file only decides which targets to dispatch and on which runner. Every
# per-target recipe lives in openssl/build/targets.sh (on Windows, the MSVC details
# in windows/build.ps1's own $Targets), because copies here drifted.
# The version selects the install prefix openssl/<version>/<target>/, so building
# another version adds a prefix next to the pinned one instead of replacing it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenSSL release version (default: the pin in openssl/VERSION)"
        required: false
        default: ""
      jobname:
        # The options are the four group values plus every targets.sh target, in its order.
        # consistency.sh check 9 fails if this list and targets.sh --names drift apart.
        description: "Target to build: a group, or a single target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - linux-x86_64-glibc
          - linux-i686-glibc
          - linux-x86_64-musl
          - linux-aarch64-glibc
          - linux-aarch64-musl
          - linux-armv6hf-glibc
          - linux-armv7hf-glibc
          - linux-armv7hf-musl
          - linux-armv5-glibc
          - linux-mipsel-uclibc
          - linux-mipsel-musl
          - linux-mips-musl
          - linux-riscv64-musl
          - linux-riscv32-musl
          - linux-sparc64-glibc
          - linux-ppc64le-glibc
          - freebsd-x86_64
          - openbsd-x86_64
          - macos-arm64
          - macos-x86_64
          - windows-x86
          - windows-x86-debug
          - windows-x64
          - windows-x64-debug
          - windows-arm64
          - windows-arm64-debug
      force:
        description: "Rebuild and overwrite even if the installed prefix already matches this version"
        required: true
        default: false
        type: boolean
      create_pr:
        description: "Open a pull request with the rebuilt archives"
        required: true
        default: false
        type: boolean
      commit:
        description: "Commit the rebuilt archives straight to the branch this run was started from (no other workflow is triggered by that push)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.r.outputs.version }}
      matrix: ${{ steps.r.outputs.matrix }}
      windows: ${{ steps.r.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: r
        name: Resolve version and matrices from targets.sh / build.ps1
        run: |
          set -euo pipefail
          . ./build-env.sh >/dev/null
          v="${{ inputs.version }}"; [ -n "$v" ] || v="$OPENSSL_VERSION"
          openssl_sha256_lookup "$v" >/dev/null \
            || { echo "::error::'$v' does not resolve to a published OpenSSL release"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # One row per unix target, name then runner, with the runner chosen by T_CI.
          rows=$(for t in $(openssl/build/targets.sh --names); do
                   case "$(openssl/build/targets.sh --field "$t" CI)" in
                     macos)   echo "$t macos-latest" ;;
                     windows) ;;
                     *)       echo "$t ubuntu-24.04" ;;
                   esac
                 done)
          # Windows names are grepped out of build.ps1's $Targets rather than run,
          # because act's image has no pwsh. consistency.sh check 5 asserts this
          # parse agrees with targets.sh --names windows.
          win=$(grep -oE "Name *= *'[^']+'" openssl/build/windows/build.ps1 | sed "s/.*'\(.*\)'/\1/")

          sel="${{ inputs.jobname }}"
          case "$sel" in
            all)     ;;
            linux)   rows=$(echo "$rows" | awk '$2=="ubuntu-24.04"'); win="" ;;
            macos)   rows=$(echo "$rows" | awk '$2=="macos-latest"'); win="" ;;
            windows) rows="" ;;
            *)       rows=$(echo "$rows" | awk -v s="$sel" '$1==s')
                     win=$(echo "$win" | awk -v s="$sel" '$0==s')
                     [ -n "$rows$win" ] || { echo "::error::'$sel' is not a target of targets.sh or windows/build.ps1"; exit 1; } ;;
          esac

          # TEMPORARY: only windows-x64 while the Windows recipe is being made to work. Remove.
          win=$(echo "$win" | awk '$0=="windows-x64"')
          m=$(echo "$rows" | awk 'NF{printf "%s{\"target\":\"%s\",\"os\":\"%s\"}", (n++?",":""), $1, $2}')
          w=$(echo "$win"  | awk 'NF{printf "%s\"%s\"", (n++?",":""), $0}')
          { echo "matrix=[$m]"; echo "windows=[$w]"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      BUILDROOT: ${{ github.workspace }}/br
      OPENSSL_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      # The same composite action and build.sh serve both runner kinds, because
      # targets.sh picks native clang on macOS and cross-compiles on Linux.
      - uses: ./.github/actions/openssl-build-target
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          force: ${{ inputs.force }}
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ hashFiles('out/**') != '' }}
        with: { name: "openssl-${{ matrix.target }}", path: out/ }

  windows:
    needs: resolve
    if: needs.resolve.outputs.windows != '[]'
    # One x64 runner covers every Windows target, because arm64 is cross-built
    # with the x64_arm64 MSVC toolset that build.ps1's VcVars selects.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.windows) }}
    env:
      BUILDROOT: ${{ github.workspace }}\br
      OPENSSL_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/setup-nasm@v1
      - name: Install Strawberry Perl (Configure needs a real Windows perl)
        shell: pwsh
        # The image ships it already, but choco's PATH change never reaches this process, so the
        # bin directory is added for the following steps explicitly.
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) { choco install -y strawberryperl --no-progress | Out-Null }
          'C:\Strawberry\perl\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & 'C:\Strawberry\perl\bin\perl.exe' -e 'print "perl $^V $^O`n"'
      - name: Fetch the OpenSSL source (URL and sha256 both from env.ps1)
        shell: pwsh
        run: |
          . openssl/build/windows/env.ps1
          New-Item -ItemType Directory -Force -Path $env:BR_DOWNLOADS | Out-Null
          if (-not (Save-BrDownload -Url $script:OpenSslUrl -Path $script:OpenSslTarball -Sha256 (Get-OpenSslSha256))) {
            throw "could not fetch $($script:OpenSslUrl)"
          }
      # This step only invokes build.ps1, which owns the recipe, the prefix layout and
      # the version gate. The force input is irrelevant here because build.ps1 always
      # rebuilds and the collect step uploads only changes.
      - name: Build ${{ matrix.target }}
        shell: pwsh
        run: |
          pwsh -File openssl/build/windows/build.ps1 ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 ${{ matrix.target }} failed" }
      - name: Collect what the build actually changed
        shell: bash
        run: |
          mkdir -p out
          git status --porcelain -- "openssl/$OPENSSL_VERSION" | awk '{print $2}' | while read -r f; do
            [ -d "$f" ] && f="$f."
            mkdir -p "out/$(dirname "$f")"; cp -r "$f" "out/$(dirname "$f")/"
          done
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ hashFiles('out/**') != '' }}
        with: { name: "openssl-windows-${{ matrix.target }}", path: out/ }

  verify-summary:
    needs: [resolve, build, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Overlay this run's freshly built prefixes onto the checkout
        run: |
          # Search rather than assume depth, because download-artifact nests under
          # artifacts/<name>/ with several artifacts but stays flat with one.
          find artifacts -type d -path '*/out/openssl' -print0 |
            while IFS= read -r -d '' d; do cp -rf "$d"/. openssl/; done
      - name: Audit every prefix with the same gates build.sh applied
        run: openssl/build/verify
      - name: Fail if any dispatched target did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more dispatched targets failed or were cancelled - their archives were NOT" >&2
          echo "regenerated this run, and the overlay step left the old committed archive in place." >&2
          exit 1
      - name: Fail if a full ('all') rebuild left any target without a prefix for this version
        if: inputs.jobname == 'all'
        run: |
          fail=0
          for t in $(openssl/build/targets.sh --names); do
            [ -d "openssl/${{ needs.resolve.outputs.version }}/$t/lib" ] && continue
            echo "MISSING: openssl/${{ needs.resolve.outputs.version }}/$t was not produced" >&2
            fail=1
          done
          exit $fail
      # A push made with GITHUB_TOKEN never starts another workflow, so the platform builds do
      # not run on the new archives until the next ordinary push. A pull request avoids that.
      - name: Commit the rebuilt archives to ${{ github.ref_name }}
        if: inputs.commit
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          JOBNAME: ${{ inputs.jobname }}
          FORCE: ${{ inputs.force }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "openssl/$VERSION"
          if git diff --cached --quiet; then
            echo "the rebuilt prefixes are byte-identical to what is committed, nothing to push"
            exit 0
          fi
          git commit -q -m "openssl: install prefixes for $VERSION ($JOBNAME)" \
            -m "Automated rebuild via $GITHUB_WORKFLOW run $GITHUB_RUN_ID (jobname=$JOBNAME, force=$FORCE), audited by openssl/build/verify." \
            -m "Switching the agent to these prefixes is a separate edit of openssl/VERSION."
          git push origin "HEAD:$REF"
          git log -1 --stat | head -40
      - name: Open a pull request with the rebuilt archives
        if: inputs.create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: openssl/${{ needs.resolve.outputs.version }}
          commit-message: "openssl: install prefixes for ${{ needs.resolve.outputs.version }} (${{ inputs.jobname }})"
          title: "openssl: install prefixes for ${{ needs.resolve.outputs.version }} (${{ inputs.jobname }})"
          body: |
            Automated rebuild via `${{ github.workflow }}` (jobname=${{ inputs.jobname }}, force=${{ inputs.force }}).
            The prefixes land under openssl/${{ needs.resolve.outputs.version }}/. Switching the agent to them is a separate edit of openssl/VERSION.

            No pull request is opened if the rebuilt prefixes are byte-identical to what is already committed.
          branch: openssl-update-${{ needs.resolve.outputs.version }}-${{ inputs.jobname }}
          base: ${{ github.ref_name }}
