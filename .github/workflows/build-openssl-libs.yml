name: Build OpenSSL static libs
run-name: Build bundled libcrypto.a/libssl.a archives
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenSSL release version"
        required: true
        default: "1.1.1w"
      sha256:
        description: "sha256 of openssl-<version>.tar.gz"
        required: true
        default: "cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8"

# Keep in sync with openssl/libstatic/linux/openssl-<arch> - a header/archive
# mismatch here is silent ABI drift.
env:
  OSSL_FLAGS: >-
    no-weak-ssl-ciphers no-srp no-psk no-comp no-zlib no-zlib-dynamic
    no-hw no-dso no-shared -no-asm no-rc5 no-idea no-md4
    no-rmd160 no-ssl no-ssl3 no-seed no-camellia no-bf no-cast no-md2
    no-mdc2 no-engine no-ocsp no-cms

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    steps:
      - name: Install multilib toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
      - name: Build x86-64 (-O3, asm enabled), x86 (-O3, no-asm), and poky64 (-Os, no-asm, native glibc x86-64 - no cross-compiler needed)
        run: |
          for arch in x86-64 x86 poky64; do
            case $arch in
              x86-64) tgt=linux-x86_64; flags="${OSSL_FLAGS/-no-asm/} enable-ec_nistp_64_gcc_128" ;;
              x86)    tgt=linux-x86;    flags="$OSSL_FLAGS" ;;
              poky64) tgt=linux-generic64; flags="$OSSL_FLAGS enable-ec_nistp_64_gcc_128" ;;
            esac
            rm -rf src && mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
            (
              cd src
              ./Configure $tgt $flags
              [ "$arch" = poky64 ] && sed -i 's/ -O3 / -Os /g' Makefile
              make -j"$(nproc)"
            )
            mkdir -p out/openssl/libstatic/linux/$arch
            cp src/libcrypto.a src/libssl.a out/openssl/libstatic/linux/$arch/
          done
      - name: Verify version stamped into archives
        run: |
          for f in $(find out -name libcrypto.a); do
            v=$(strings "$f" | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
            echo "$f -> $v"
            test "$v" = "OpenSSL ${{ inputs.version }}"
          done
      - name: Verify x86-64 has asm objects, x86 does not
        run: |
          # x86_64cpuid.o only gets compiled in when asm is enabled - it's the
          # runtime CPU-feature probe the AES-NI/SHA-NI/etc. asm paths dispatch on.
          x64_asm=$(ar t out/openssl/libstatic/linux/x86-64/libcrypto.a | grep -c '^x86_64cpuid\.o$' || true)
          x86_asm=$(ar t out/openssl/libstatic/linux/x86/libcrypto.a | grep -cE 'x86_64|aesni|cpuid' || true)
          echo "x86-64 asm objects present (expect 1): $x64_asm"
          echo "x86 asm-named objects (expect 0): $x86_asm"
          test "$x64_asm" -eq 1
          test "$x86_asm" -eq 0
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-linux-native
          path: out/

  linux-cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # extra: enable-ec_nistp_64_gcc_128 needs GCC __int128, so it's only set on genuinely 64-bit targets.
          # asm: "1" drops -no-asm - only set where the target actually has an asm module.
          - { dir: aarch64,            target: linux-aarch64,   cc: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu, extra: "enable-ec_nistp_64_gcc_128", asm: "1" }
          - { dir: arm64,              target: linux-aarch64,   cc: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu, extra: "enable-ec_nistp_64_gcc_128", asm: "1" }
          - { dir: aarch64-cortex-a53, target: linux-aarch64,   cc: aarch64-linux-gnu-gcc, pkg: gcc-aarch64-linux-gnu, cflags: "-mcpu=cortex-a53", extra: "enable-ec_nistp_64_gcc_128", asm: "1" }
          - { dir: armhf,              target: linux-armv4,     cc: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf, asm: "1" }
          - { dir: arm-linaro,         target: linux-generic32, cc: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf }
          - { dir: arm,                target: linux-generic32, cc: arm-linux-gnueabi-gcc, pkg: gcc-arm-linux-gnueabi }
          # pogo (PogoPlug, ARMv5TE softfloat): same toolchain as arm above - apt's
          # arm-linux-gnueabi-gcc defaults to exactly the ABI real PogoPlug hardware needs.
          - { dir: pogo,               target: linux-generic32, cc: arm-linux-gnueabi-gcc, pkg: gcc-arm-linux-gnueabi }
          - { dir: mips,               target: linux-generic32, cc: mips-linux-gnu-gcc, pkg: gcc-mips-linux-gnu }
          - { dir: mipsel,             target: linux-mips32,    cc: mipsel-linux-gnu-gcc, pkg: gcc-mipsel-linux-gnu, asm: "1" }
          - { dir: riscv64,            target: linux64-riscv64, cc: riscv64-linux-gnu-gcc, pkg: gcc-riscv64-linux-gnu, extra: "enable-ec_nistp_64_gcc_128" }
          - { dir: riscv64-generic,    target: linux-generic64, cc: riscv64-linux-gnu-gcc, pkg: gcc-riscv64-linux-gnu, cflags: "-march=rv64gc -mabi=lp64d", extra: "enable-ec_nistp_64_gcc_128" }
    steps:
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build ${{ matrix.dir }} (-Os, embedded targets are flash constrained)
        run: |
          cd src
          flags="$OSSL_FLAGS"
          [ -n "${{ matrix.asm }}" ] && flags="${flags/-no-asm/}"
          CC="${{ matrix.cc }} ${{ matrix.cflags }}" ./Configure ${{ matrix.target }} $flags ${{ matrix.extra }}
          sed -i 's/ -O3 / -Os /g' Makefile
          make -j"$(nproc)"
      - name: Verify version and target architecture
        run: |
          cd src
          v=$(strings libcrypto.a | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
          echo "version: $v"
          test "$v" = "OpenSSL ${{ inputs.version }}"
          # Guard against Configure silently falling back to the host compiler.
          obj=$(ar t libcrypto.a | grep -m1 '\.o$')
          mkdir -p /tmp/probe && cd /tmp/probe && ar x "$GITHUB_WORKSPACE/src/libcrypto.a" "$obj"
          file "$obj"
          if file "$obj" | grep -q 'x86-64'; then
            echo "ERROR: ${{ matrix.dir }} archive contains host x86-64 objects" >&2
            exit 1
          fi
      - name: Stage repo layout
        run: |
          mkdir -p out/openssl/libstatic/linux/${{ matrix.dir }}
          cp src/libcrypto.a src/libssl.a out/openssl/libstatic/linux/${{ matrix.dir }}/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-linux-${{ matrix.dir }}
          path: out/

  linux-musl:
    runs-on: ubuntu-24.04
    container: alpine:3.20
    steps:
      - name: Install build deps
        run: apk add --no-cache build-base perl curl file
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build alpine-x86-64 (musl)
        run: |
          cd src
          ./Configure linux-x86_64 ${{ env.OSSL_FLAGS }} enable-ec_nistp_64_gcc_128
          make -j"$(nproc)"
          strings libcrypto.a | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u
      - name: Stage repo layout
        run: |
          mkdir -p out/openssl/libstatic/linux/alpine-x86-64
          cp src/libcrypto.a src/libssl.a out/openssl/libstatic/linux/alpine-x86-64/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-linux-alpine
          path: out/

  openwrt-mips:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ar71xx/generic: classic Atheros/Qualcomm AR71xx/AR9xxx routers, genuine MIPS 24Kc cores.
          - { dir: mips24kc,   subtarget: ar71xx/generic, toolchain: toolchain-mips_24kc_gcc-7.3.0_musl,   ccbin: mips-openwrt-linux-musl-gcc }
          # ramips/mt7621: MediaTek MT7621-family routers (Xiaomi, GL.iNet, EdgeRouter X, etc.)
          - { dir: mipsel24kc, subtarget: ramips/mt7621,  toolchain: toolchain-mipsel_24kc_gcc-7.3.0_musl, ccbin: mipsel-openwrt-linux-musl-gcc }
    steps:
      - name: Download and extract OpenWrt 18.06.9 SDK (${{ matrix.dir }})
        run: |
          file="openwrt-sdk-18.06.9-$(echo ${{ matrix.subtarget }} | tr / -)_gcc-7.3.0_musl.Linux-x86_64.tar.xz"
          curl -sSL --fail -o sdk.tar.xz "https://downloads.openwrt.org/releases/18.06.9/targets/${{ matrix.subtarget }}/$file"
          mkdir sdk && tar xf sdk.tar.xz -C sdk --strip-components=1
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build ${{ matrix.dir }} (musl, -Os, no asm module for linux-generic32)
        run: |
          cd src
          sdk="$GITHUB_WORKSPACE/sdk/staging_dir/${{ matrix.toolchain }}"
          CC="$sdk/bin/${{ matrix.ccbin }} --sysroot=$sdk" ./Configure linux-generic32 $OSSL_FLAGS
          sed -i 's/ -O3 / -Os /g' Makefile
          make -j"$(nproc)"
      - name: Verify version and target architecture
        run: |
          cd src
          v=$(strings libcrypto.a | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
          echo "version: $v"
          test "$v" = "OpenSSL ${{ inputs.version }}"
          obj=$(ar t libcrypto.a | grep -m1 '\.o$')
          mkdir -p /tmp/probe && cd /tmp/probe && ar x "$GITHUB_WORKSPACE/src/libcrypto.a" "$obj"
          file "$obj"
          if file "$obj" | grep -q 'x86-64'; then
            echo "ERROR: ${{ matrix.dir }} archive contains host x86-64 objects" >&2
            exit 1
          fi
      - name: Stage repo layout
        run: |
          mkdir -p out/openssl/libstatic/linux/${{ matrix.dir }}
          cp src/libcrypto.a src/libssl.a out/openssl/libstatic/linux/${{ matrix.dir }}/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-linux-${{ matrix.dir }}
          path: out/

  openwrt-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and extract OpenWrt 18.06.9 x86-64 SDK
        run: |
          curl -sSL --fail -o sdk.tar.xz \
            https://downloads.openwrt.org/releases/18.06.9/targets/x86/64/openwrt-sdk-18.06.9-x86-64_gcc-7.3.0_musl.Linux-x86_64.tar.xz
          mkdir sdk && tar xf sdk.tar.xz -C sdk --strip-components=1
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build openwrt_x86_64 (musl, -Os, asm enabled)
        run: |
          cd src
          sdk="$GITHUB_WORKSPACE/sdk/staging_dir/toolchain-x86_64_gcc-7.3.0_musl"
          CC="$sdk/bin/x86_64-openwrt-linux-musl-gcc --sysroot=$sdk" \
            ./Configure linux-x86_64 "${OSSL_FLAGS/-no-asm/}" enable-ec_nistp_64_gcc_128
          sed -i 's/ -O3 / -Os /g' Makefile
          make -j"$(nproc)"
      - name: Verify version and target architecture
        run: |
          cd src
          v=$(strings libcrypto.a | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
          echo "version: $v"
          test "$v" = "OpenSSL ${{ inputs.version }}"
          obj=$(ar t libcrypto.a | grep -m1 '\.o$')
          mkdir -p /tmp/probe && cd /tmp/probe && ar x "$GITHUB_WORKSPACE/src/libcrypto.a" "$obj"
          file "$obj"
      - name: Stage repo layout
        run: |
          mkdir -p out/openssl/libstatic/linux/openwrt_x86_64
          cp src/libcrypto.a src/libssl.a out/openssl/libstatic/linux/openwrt_x86_64/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-linux-openwrt-x86_64
          path: out/

  armada370-hf:
    runs-on: ubuntu-24.04
    steps:
      # dd-wrt's 4.2GB toolchain archive; only arm_cortex-a9 musl is needed.
      # The server aborts mid-transfer often, so this resumes, not restarts.
      - name: Download dd-wrt toolchain (arm_cortex-a9 musl)
        run: |
          for i in $(seq 1 50); do
            curl --http1.1 -sS -C - --connect-timeout 20 --max-time 300 -o toolchains.tar.xz \
              https://download1.dd-wrt.com/dd-wrtv2/downloads/toolchains/toolchains.tar.xz && break
          done
          tar xf toolchains.tar.xz toolchain-arm_cortex-a9_gcc-15.2.0_musl_eabi
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
          mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
      - name: Build linux-armada370-hf (musl, -Os, no-asm - linux-armv4 asm broke crypto correctness on this Configure target)
        run: |
          cd src
          tc="$GITHUB_WORKSPACE/toolchain-arm_cortex-a9_gcc-15.2.0_musl_eabi"
          CC="$tc/bin/arm-openwrt-linux-muslgnueabi-gcc" ./Configure linux-armv4 $OSSL_FLAGS
          sed -i 's/ -O3 / -Os /g' Makefile
          make -j"$(nproc)"
      - name: Verify version and target architecture
        run: |
          cd src
          v=$(strings libcrypto.a | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
          echo "version: $v"
          test "$v" = "OpenSSL ${{ inputs.version }}"
          obj=$(ar t libcrypto.a | grep -m1 '\.o$')
          mkdir -p /tmp/probe && cd /tmp/probe && ar x "$GITHUB_WORKSPACE/src/libcrypto.a" "$obj"
          file "$obj"
          if file "$obj" | grep -q 'x86-64'; then
            echo "ERROR: linux-armada370-hf archive contains host x86-64 objects" >&2
            exit 1
          fi
      - name: Stage repo layout
        run: |
          mkdir -p out/openssl/libstatic/linux/linux-armada370-hf
          cp src/libcrypto.a src/libssl.a out/openssl/libstatic/linux/linux-armada370-hf/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-linux-armada370-hf
          path: out/

  windows:
    runs-on: ${{ matrix.platform == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32, vcconf: VC-WIN32,     msvc_arch: x86,   suffix: 32,    debugflag: "",        asm: "1" }
          - { platform: win32, vcconf: VC-WIN32,     msvc_arch: x86,   suffix: 32,    debugflag: "--debug", asm: "1", dsuffix: d }
          - { platform: win64, vcconf: VC-WIN64A,    msvc_arch: x64,   suffix: 64,    debugflag: "",        asm: "1" }
          - { platform: win64, vcconf: VC-WIN64A,    msvc_arch: x64,   suffix: 64,    debugflag: "--debug", asm: "1", dsuffix: d }
          - { platform: arm64, vcconf: VC-WIN64-ARM, msvc_arch: arm64, suffix: ARM64, debugflag: "" }
          - { platform: arm64, vcconf: VC-WIN64-ARM, msvc_arch: arm64, suffix: ARM64, debugflag: "--debug", dsuffix: d }
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: ilammy/setup-nasm@v1
        if: matrix.asm
      - name: Install Strawberry Perl (Configure needs it)
        shell: pwsh
        run: choco install -y strawberryperl --no-progress
      - name: Download and verify source
        shell: pwsh
        run: |
          curl.exe -sSL -o ossl.tar.gz https://github.com/openssl/openssl/releases/download/OpenSSL_$("${{ inputs.version }}" -replace '\.','_')/openssl-${{ inputs.version }}.tar.gz
          $hash = (Get-FileHash ossl.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ inputs.sha256 }}") { throw "checksum mismatch: $hash" }
          tar xzf ossl.tar.gz
          Rename-Item "openssl-${{ inputs.version }}" src
      - name: Configure (asm ${{ matrix.asm && 'enabled' || 'disabled' }}), patch CRT to static, build
        shell: cmd
        run: |
          cd src
          set FLAGS=%OSSL_FLAGS%
          if "${{ matrix.asm }}"=="1" set FLAGS=%FLAGS:-no-asm=%
          perl Configure ${{ matrix.vcconf }} ${{ matrix.debugflag }} %FLAGS%
          if "${{ matrix.debugflag }}"=="" (powershell -Command "(Get-Content makefile) -replace '/MD\b', '/MT' | Set-Content makefile") else (powershell -Command "(Get-Content makefile) -replace '/MDd\b', '/MTd' | Set-Content makefile")
          nmake
      - name: Verify version stamped into archive
        shell: pwsh
        run: |
          $m = Select-String -Path src/libcrypto.lib -Pattern "OpenSSL ${{ inputs.version }} " -Encoding Ascii
          if (-not $m) { throw "version string OpenSSL ${{ inputs.version }} not found in libcrypto.lib" }
      - name: Stage repo layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/openssl/libstatic | Out-Null
          Copy-Item src/libcrypto.lib "out/openssl/libstatic/libcrypto${{ matrix.suffix }}MT${{ matrix.dsuffix }}.lib"
          Copy-Item src/libssl.lib    "out/openssl/libstatic/libssl${{ matrix.suffix }}MT${{ matrix.dsuffix }}.lib"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-windows-${{ matrix.platform }}${{ matrix.dsuffix }}
          path: out/

  macos:
    runs-on: macos-latest
    steps:
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | shasum -a 256 -c -
      - name: Build osx-x86-64 and osx-arm-64
        run: |
          for arch in osx-x86-64 osx-arm-64; do
            case $arch in
              osx-x86-64) tgt=darwin64-x86_64-cc ;;
              osx-arm-64) tgt=darwin64-arm64-cc ;;
            esac
            rm -rf src && mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
            ( cd src && ./Configure $tgt ${{ env.OSSL_FLAGS }} enable-ec_nistp_64_gcc_128 && make -j"$(sysctl -n hw.ncpu)" )
            mkdir -p out/openssl/libstatic/macos/$arch
            cp src/libcrypto.a src/libssl.a out/openssl/libstatic/macos/$arch/
          done
      - name: Verify version
        run: |
          for f in $(find out -name libcrypto.a); do
            v=$(strings "$f" | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
            echo "$f -> $v"
            test "$v" = "OpenSSL ${{ inputs.version }}"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-macos
          path: out/

  bsd:
    runs-on: ubuntu-24.04
    steps:
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Download and verify source
        run: |
          curl -sSL -o ossl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_$(echo "${{ inputs.version }}" | tr . _)/openssl-${{ inputs.version }}.tar.gz
          echo "${{ inputs.sha256 }}  ossl.tar.gz" | sha256sum -c -
      - name: Build freebsd_x86-64 and openbsd_x86-64 (clang cross + minimal sysroot)
        run: |
          for os in freebsd openbsd; do
            case $os in
              freebsd)
                rel=https://download.freebsd.org/releases/amd64/amd64/14.3-RELEASE
                tarball=base.txz; triple=x86_64-unknown-freebsd14.3; maketgt=""
                sha=$(curl -sSL --fail "$rel/MANIFEST" | awk '$1=="base.txz"{print $2}')
                ;;
              openbsd)
                rel=https://cdn.openbsd.org/pub/OpenBSD/7.9/amd64
                tarball=base79.tgz; triple=x86_64-unknown-openbsd7.9; maketgt="build_libs"
                sha=$(curl -sSL --fail "$rel/SHA256" | awk '/^SHA256 \(base79.tgz\)/{print $4}')
                ;;
            esac
            [ -n "$sha" ] || { echo "ERROR: couldn't fetch $os checksum manifest" >&2; exit 1; }
            curl -sSL --fail -o "$tarball" "$rel/$tarball"
            echo "$sha  $tarball" | sha256sum -c -
            sysroot="$GITHUB_WORKSPACE/sysroot-$os"
            mkdir -p "$sysroot" && tar xf "$tarball" -C "$sysroot" ./usr/include ./usr/lib
            rm -rf src && mkdir src && tar xzf ossl.tar.gz -C src --strip-components=1
            ( cd src && CC="clang --target=$triple --sysroot=$sysroot -fuse-ld=lld" \
              ./Configure BSD-x86_64 "${OSSL_FLAGS/-no-asm/}" enable-ec_nistp_64_gcc_128 && \
              make -j"$(nproc)" $maketgt )
            mkdir -p "out/openssl/libstatic/bsd/${os}_x86-64"
            cp src/libcrypto.a src/libssl.a "out/openssl/libstatic/bsd/${os}_x86-64/"
          done
      - name: Verify version stamped into archives
        run: |
          for f in $(find out -name libcrypto.a); do
            v=$(strings "$f" | grep -oE 'OpenSSL 1\.[0-9]\.[0-9][a-z]?' | sort -u)
            echo "$f -> $v"
            test "$v" = "OpenSSL ${{ inputs.version }}"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl-bsd
          path: out/

  verify-summary:
    needs: [linux-native, linux-cross, linux-musl, openwrt-mips, openwrt-x86_64, armada370-hf, windows, macos, bsd]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Overlay this run's freshly built archives onto the checkout
        run: |
          for d in artifacts/*/openssl/libstatic; do
            [ -d "$d" ] || continue
            cp -rf "$d"/. openssl/libstatic/
          done
      - name: Audit every archive - version, object count, glibc-only symbols
        run: |
          chmod +x openssl/libstatic/verify
          openssl/libstatic/verify

