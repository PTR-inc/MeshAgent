name: FreeBSD Builder
run-name: Build FreeBSD versions of MeshAgent
# Called by build.yml (manual, one platform or all) or run alone from the Actions tab with
# workflow_dispatch. What this platform is built from is listed in .github/build-inputs.txt.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  freebsd-build-x86-64:
    name: FreeBSD x86_64 (ARCHID=30)
    # Cross-compiled with clang and a base.txz sysroot, so no FreeBSD VM is needed.
    # The release, sysroot location and mirror fallback come from ARCH_30's BSDREL,
    # build-env.sh and fetch-toolchains.sh, so nothing is restated here.
    runs-on: ubuntu-24.04
    env:
      BUILDROOT: ${{ github.workspace }}/br
      # ccache 4 defaults differ per OS, so the directory is named here. The runner context is
      # not allowed in a job env, so it lives under the workspace, which checkout cleans first.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install clang, lld and ccache
        run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq -y install clang lld ccache >/dev/null
      - name: Fetch the FreeBSD sysroot
        run: ./fetch-toolchains.sh -y freebsd >/dev/null
      - name: Restore the ccache for ARCHID 30
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-freebsd-30-${{ github.sha }}
          restore-keys: ccache-freebsd-30-
      - name: Build meshagent (x86_64)
        run: make -s -j4 freebsd ARCHID=30 CROSS=1 CCACHE=1 V=@
      - name: ccache statistics
        run: ccache -s | grep -E 'Hits|Misses'
      - name: Verify the binary targets FreeBSD
        run: |
          file build/freebsd_x86-64/meshagent_freebsd_x86-64
          file build/freebsd_x86-64/meshagent_freebsd_x86-64 | grep -q FreeBSD
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-freebsd-x86_64
          path: ${{ github.workspace }}/build/*/meshagent_*
