name: FreeBSD Build
run-name: Build FreeBSD versions of MeshAgent
# Manual only for now: a BSD build takes long enough that it should not run on every push
# while other platforms are being tested. Run it from the Actions tab or with `gh workflow run`.
on:
  workflow_dispatch:

jobs:
  freebsd-build-x86-64:
    name: FreeBSD x86_64 (ARCHID=30)
    # Cross-compiled with clang and a base.txz sysroot, so no FreeBSD VM is needed.
    # The release, sysroot location and mirror fallback come from ARCH_30's BSDREL,
    # build-env.sh and fetch-toolchains.sh, so nothing is restated here. See BUILD.md.
    runs-on: ubuntu-24.04
    env:
      BUILDROOT: ${{ github.workspace }}/br
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Fetch the FreeBSD sysroot
        run: ./fetch-toolchains.sh -y freebsd
      - name: Build meshagent (x86_64)
        run: make -j4 freebsd ARCHID=30 CROSS=1
      - name: Verify the binary targets FreeBSD
        run: |
          file build/freebsd_x86-64/meshagent_freebsd_x86-64
          file build/freebsd_x86-64/meshagent_freebsd_x86-64 | grep -q FreeBSD
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meshagent-freebsd-x86_64
          path: ${{ github.workspace }}/build/*/meshagent_*
