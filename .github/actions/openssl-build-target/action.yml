name: Build one OpenSSL target
description: >
  Skip-check, provision, build and collect a single targets.sh target using the
  same openssl/build/build.sh a developer runs locally. Shared by the linux and
  macos jobs so there is exactly one CI recipe, not one per family.

inputs:
  target:
    description: targets.sh target name
    required: true
  version:
    description: OpenSSL version being built
    required: true
  force:
    description: rebuild even if the committed archive already matches
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Skip if ${{ inputs.target }} already matches OpenSSL ${{ inputs.version }}
      id: check
      shell: bash
      # The version selects the prefix, so a rebuild for another version never touches this one.
      run: |
        skip=true
        f="openssl/${{ inputs.version }}/${{ inputs.target }}/lib/libcrypto.a"
        { [ -f "$f" ] && strings "$f" | grep -qF "OpenSSL ${{ inputs.version }} "; } || skip=false
        [ '${{ inputs.force }}' = 'true' ] && skip=false
        echo "skip=$skip" >> "$GITHUB_OUTPUT"
        [ "$skip" = true ] && echo "::notice::${{ inputs.target }} already at OpenSSL ${{ inputs.version }} and force=false - skipping rebuild."
        true

    - name: Fetch the OpenSSL source
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: ./fetch-toolchains.sh -y openssl

    # BR_FETCH=1 lets build.sh provision its own toolchain from the target's T_FETCH
    # tokens, the same table `make list` and fetch-toolchains.sh read. That is why no
    # per-target toolchain installation step lives in YAML.
    - name: Build ${{ inputs.target }}
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: BR_FETCH=1 OPENSSL_VERSION='${{ inputs.version }}' openssl/build/build.sh '${{ inputs.target }}'

    - name: Collect the installed prefix and, for a new version, the shared headers
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: |
        v='${{ inputs.version }}'; t='${{ inputs.target }}'
        mkdir -p "out/openssl/$v"
        cp -r "openssl/$v/$t" "out/openssl/$v/"
        git status --porcelain -- "openssl/$v/include" | grep -q . && cp -r "openssl/$v/include" "out/openssl/$v/"
        true
