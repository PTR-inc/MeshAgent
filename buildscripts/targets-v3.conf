# MeshAgent build targets, one row per ARCHID. Read by target-v3.sh, which derives everything else
# (compiler and linker line, OpenSSL prefix, jpeg archive, libc label, sysroot, strip tool) from these
# columns, and by makefile.v3, fetch-deps-v3.sh and check-v3.sh through it. Lines starting with # are
# comments, fields are key=value separated by spaces, a value with spaces is quoted.
#
# A row states only what differs from the default. check-v3.sh fails a row that restates a default,
# because a restated value hides which rows really deviate and goes stale unnoticed.
# Keys appear in this order: archid name os osver arch cpu abi libc libcver link kvm lms opt server zig cc cflags
#
# Columns
#   archid   the build's own id and, unless server= says otherwise, what it reports to MeshCentral
#   name     binary suffix: build/<name>/meshagent_<name>
#   os       linux, freebsd, openbsd or macos
#   osver    freebsd/openbsd: the release whose sysroot is used; macos: the deployment floor
#   arch     x86 x86_64 arm aarch64 mips mipsel riscv32 riscv64 sparc64 powerpc64le
#   cpu      -mcpu= when the silicon is older than the arch default (arm1176jzf_s, mips32)
#   abi      arm: eabi or eabihf (soft or hard float); riscv: the -mabi (lp64d, ilp32d); mips: eabi (soft float)
#   libc     glibc or musl (linux only). bsd and macos have one libc each
#   libcver  glibc floor pinned in the zig triple. musl carries no version
#   link     static for a glibc row that must not need the device's libc. musl rows are static regardless
#   kvm lms  1 to include remote desktop sources or Intel LMS support (default 0)
#   opt      Os for routers and boards short on flash (default O2)
#   server   ARCHID reported to the server when it differs from archid (MeshCentral only knows the classic ids)
#   zig      zig release for this row when it must differ from ZIG_VERSION in env-v3.sh
#   cc       full compiler command for a row that cannot use zig
#   cflags   extra -D flags this row needs
#
# Things that used to be per-row and are now derived or gone, measured 2026-09-12:
#   the strip tool follows the host (llvm-strip, Apple's strip for a Mach-O built on a Mac); fortify is on
#   for glibc and meaningless on musl; -fstack-protector is on everywhere; the fswatcher is on everywhere
#   it compiles; BADMATH, LEGACY_LD and NOLDHARDEN had no remaining effect under zig's lld.

# ---- Linux glibc -----------------------------------------------------------------------------
# Bootlin's oldest x86 glibc was 2.24, so that stays the floor for the x86 rows.
archid=5  name=x86                 os=linux arch=x86         libc=glibc libcver=2.24 kvm=1 lms=1
archid=6  name=x86-64              os=linux arch=x86_64      libc=glibc libcver=2.24 kvm=1 lms=1
archid=19 name=x86_nokvm           os=linux arch=x86         libc=glibc libcver=2.24       lms=1
archid=20 name=x86-64_nokvm        os=linux arch=x86_64      libc=glibc libcver=2.24       lms=1
# ARMv5 soft float. glibc 2.31 is the Bootlin pin every ARM glibc row used.
archid=9  name=arm                 os=linux arch=arm         abi=eabi   libc=glibc libcver=2.31
# ARMv7 hard float, the Pi 2 and up on a 32-bit userland. Links the ARMv6 jpeg archive, which runs on v7.
archid=24 name=arm-linaro          os=linux arch=arm         abi=eabihf libc=glibc libcver=2.31 kvm=1
# Pi 1 and Zero: ARM1176JZF-S, VFPv2. glibc 2.28 is Raspbian Buster, the oldest Pi OS still in the field.
archid=25 name=arm6hf              os=linux arch=arm cpu=arm1176jzf_s abi=eabihf libc=glibc libcver=2.28 kvm=1
# 26 is the current aarch64 build, 32 the compatibility one for older userlands. Same OpenSSL archive.
archid=26 name=arm64               os=linux arch=aarch64     libc=glibc libcver=2.40 kvm=1
archid=32 name=aarch64             os=linux arch=aarch64     libc=glibc libcver=2.31 kvm=1
# Reference builds without vendor hardware. They report the classic RISC-V64 id 45.
archid=60 name=sparc64-generic     os=linux arch=sparc64     libc=glibc libcver=2.31 server=45 cc="$BOOTLIN_SPARC64/bin/sparc64-linux-gcc"
archid=70 name=powerpc64le-generic os=linux arch=powerpc64le libc=glibc libcver=2.31 server=45

# ---- Linux musl (always static) ---------------------------------------------------------------
# 7 is MIPS32r1 little-endian for pre-r2 silicon and must not share 40's r2 code.
archid=7  name=mips                os=linux arch=mipsel cpu=mips32 abi=eabi libc=musl opt=Os cflags="-DNO_IPADDR_MONITOR -DNO_IFADDR"
archid=28 name=mips24kc            os=linux arch=mips        abi=eabi   libc=musl opt=Os
archid=40 name=mipsel24kc          os=linux arch=mipsel      abi=eabi   libc=musl opt=Os
archid=33 name=alpine-x86-64       os=linux arch=x86_64      libc=musl lms=1
archid=36 name=openwrt_x86_64      os=linux arch=x86_64      libc=musl opt=Os
archid=41 name=aarch64-cortex-a53  os=linux arch=aarch64     libc=musl opt=Os
# Synology Armada 370: vendor glibc firmware with no musl loader on the device, which static musl does not need.
archid=35 name=linux-armada370-hf  os=linux arch=arm         abi=eabihf libc=musl opt=Os
# 45 and 46 are the same build under two names since the T-Head vendor extensions were dropped.
archid=45 name=riscv64             os=linux arch=riscv64     abi=lp64d  libc=musl opt=Os
archid=46 name=riscv64-generic     os=linux arch=riscv64     abi=lp64d  libc=musl opt=Os
archid=47 name=riscv32-generic     os=linux arch=riscv32     abi=ilp32d libc=musl opt=Os server=45

# ---- BSD -------------------------------------------------------------------------------------
archid=30 name=freebsd_x86-64      os=freebsd osver=14.4 arch=x86_64
archid=37 name=openbsd_x86-64      os=openbsd osver=7.9  arch=x86_64

# ---- macOS -----------------------------------------------------------------------------------
# 10.15 lets clang resolve mac_kvm.c's @available check statically; 11.0 is the first Apple Silicon release.
archid=16 name=osx-x86-64          os=macos osver=10.15 arch=x86_64  kvm=1
archid=29 name=osx-arm-64          os=macos osver=11.0  arch=aarch64 kvm=1
